name: Engine and web checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - run: pnpm verify
      - run: uv run pytest
      - name: CPU model golden tests
        run: |
          uv pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install 'mlx[cpu]==0.32.4' 'mlx-lm==0.32.2' 'transformers==5.23.0'
          .venv/bin/python -c 'import mlx.core, mlx_lm, torch'
          .venv/bin/python -m pytest engine/tests
      - name: Cache pinned CPU fixture checkpoints
        id: smol-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vibechecker/smol-pair
          key: smollm2-135m-pair-${{ hashFiles('engine/tools/smoke_smol.py', 'engine/tools/fetch_weights.py') }}
      - name: Score with the pinned SmolLM2 base and instruct pair
        env:
          HF_HUB_OFFLINE: ${{ steps.smol-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: .venv/bin/python engine/tools/smoke_smol.py
      - run: pnpm --filter @vibechecker/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vibechecker/web e2e
