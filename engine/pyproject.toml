[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibechecker-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4,<2",
    "lingua-language-detector>=2.1,<3",
    "numpy>=2,<3",
    "regex>=2024.11",
    "scikit-learn>=1.6,<2",
    "scipy>=1.13,<2",
    "spacy>=3.8,<4",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
cpu = ["mlx[cpu]>=0.32.4,<0.33; sys_platform == 'linux'", "mlx-lm>=0.32.2,<0.33; sys_platform == 'linux'", "torch>=2.9,<3", "transformers>=5.7,<6"]
metal = ["mlx>=0.32.4,<0.33; sys_platform == 'darwin'", "mlx-lm>=0.32.2,<0.33; sys_platform == 'darwin'", "torch>=2.9,<3", "transformers>=5.7,<6"]
cuda = ["mlx[cuda13]>=0.32.4,<0.33; sys_platform == 'linux'", "mlx-lm>=0.32.2,<0.33; sys_platform == 'linux'", "torch>=2.9,<3", "transformers>=5.7,<6"]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
vibechecker-benchmark = "vibechecker_engine.benchmark:main"
