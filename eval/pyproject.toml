[project]
name = "vibechecker-eval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["vibechecker-engine", "pyyaml>=6", "numpy>=1.26", "scikit-learn>=1.4", "pyarrow>=17", "boto3>=1.35"]

[project.scripts]
vibechecker-eval = "vibechecker_eval.cli:main"
vibechecker-academic-addition = "vibechecker_eval.academic_addition:main"

[tool.uv.sources]
vibechecker-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibechecker_eval"]

[tool.hatch.build.targets.wheel.force-include]
"registry.yaml" = "vibechecker_eval/registry.yaml"
