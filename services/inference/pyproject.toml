[project]
name = "vibechecker-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30", "httpx>=0.28", "psutil>=6", "vibechecker-engine", "pydantic>=2.10,<3"]

[tool.uv.sources]
vibechecker-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
